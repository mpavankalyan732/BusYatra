# Render Blueprint: PostgreSQL + API (web service) + frontend (static site).
# In Render: New + > Blueprint > pick this repo. Fill the `sync: false` secrets in the dashboard.
databases:
  - name: busyatra-db
    databaseName: busyatra
    user: busyatra
    plan: free

services:
  - type: web
    name: busyatra-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate
    # Migrations + idempotent seed run at boot (pre-deploy commands need a paid plan).
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: busyatra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_ACTION_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://busyatra-web.onrender.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_INSTANCE_URL
        sync: false
      - key: SALESFORCE_TOKEN_URL
        sync: false
      - key: AGENTFORCE_CONFIGURATION
        sync: false

  - type: web
    name: busyatra-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://busyatra-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
