<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BusYatra — search, compare and book intercity bus tickets." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://busyatra-api.onrender.com" crossorigin />
    <link rel="preconnect" href="https://orgfarm-3181b9f7b4-dev-ed.develop.my.site.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>BusYatra — Book Bus Tickets</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Salesforce Enhanced Chat (BusYatra Reschedule Agent): loaded AFTER the page so it never blocks the site -->
    <script type="text/javascript">
      function initEmbeddedMessaging() {
        try {
          embeddedservice_bootstrap.settings.language = 'en_US';
          embeddedservice_bootstrap.init(
            '00Dfj00000mbzot',
            'BusYatra_Web_Chat',
            'https://orgfarm-3181b9f7b4-dev-ed.develop.my.site.com/ESWBusYatraWebC1793872994900',
            { scrt2URL: 'https://orgfarm-3181b9f7b4-dev-ed.develop.my.salesforce-scrt.com' }
          );
        } catch (err) {
          console.error('Error loading Embedded Messaging: ', err);
        }
      }
      var ESW_SRC = 'https://orgfarm-3181b9f7b4-dev-ed.develop.my.site.com/ESWBusYatraWebC1793872994900/assets/js/bootstrap.min.js';
      var eswTries = 0, eswInitDone = false;
      function loadEmbeddedMessaging() {
        if (eswInitDone || window.embeddedservice_bootstrap) return;
        eswTries++;
        var s = document.createElement('script');
        s.src = ESW_SRC + (eswTries > 1 ? '?retry=' + eswTries : '');
        s.async = true;
        s.onload = function () { if (!eswInitDone) { eswInitDone = true; initEmbeddedMessaging(); } };
        s.onerror = function () { if (eswTries < 4) setTimeout(loadEmbeddedMessaging, 3000); };
        document.body.appendChild(s);
        // Salesforce site can be slow to wake up: retry if the chat has not loaded in 15 seconds
        setTimeout(function () { if (!window.embeddedservice_bootstrap && eswTries < 4) loadEmbeddedMessaging(); }, 15000);
      }
      if (document.readyState === 'complete') { loadEmbeddedMessaging(); }
      else { window.addEventListener('load', loadEmbeddedMessaging); }
      // Wake the free Render API early so the first search is not slow
      try { fetch('https://busyatra-api.onrender.com/', { mode: 'no-cors' }); } catch (e) {}
    </script>
  </body>
</html>
